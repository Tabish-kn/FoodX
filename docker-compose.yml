version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: foodx-postgres
    restart: always
    environment:
      POSTGRES_USER: foodx_user
      POSTGRES_PASSWORD: foodx_secret
      POSTGRES_DB: foodx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: foodx-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: foodx-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://foodx_user:foodx_secret@postgres:5432/foodx_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=foodx-jwt-super-secret-key-production-32chars-min
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: foodx-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
